<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%" fill="none" role="img" aria-label="ISHTI Icon - Sacred Vedic Flame and Stepped Altar">
  <title>ISHTI Icon</title>
  <desc>Sacred Vedic flame with a golden bindu seed rising from a four-tiered stepped altar</desc>
  
  
    <defs>
      <!-- Flame gradient: Deep maroon at base to vibrant saffron to radiant gold at tip -->
      <linearGradient id="ishti-icon-flame-main" x1="50%" y1="100%" x2="50%" y2="0%">
        <stop offset="0%" stop-color="#711B16" />
        <stop offset="35%" stop-color="#C23616" />
        <stop offset="70%" stop-color="#EF7428" />
        <stop offset="100%" stop-color="#F7B731" />
      </linearGradient>

      <!-- Outer flame gradient -->
      <linearGradient id="ishti-icon-flame-outer" x1="0%" y1="100%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#711B16" />
        <stop offset="50%" stop-color="#D3461A" />
        <stop offset="100%" stop-color="#EF7428" />
      </linearGradient>

      <!-- Center inner spire gradient -->
      <linearGradient id="ishti-icon-flame-spire" x1="50%" y1="100%" x2="50%" y2="0%">
        <stop offset="0%" stop-color="#D3461A" />
        <stop offset="50%" stop-color="#EF7428" />
        <stop offset="100%" stop-color="#FDCB58" />
      </linearGradient>

      <!-- Golden Seed Bindu drop gradient -->
      <radialGradient id="ishti-icon-bindu" cx="50%" cy="40%" r="60%">
        <stop offset="0%" stop-color="#FFF2A3" />
        <stop offset="60%" stop-color="#D7A64A" />
        <stop offset="100%" stop-color="#EF7428" />
      </radialGradient>

      <!-- Altar Left Facets (Saffron & Terracotta light) -->
      <linearGradient id="ishti-icon-altar-left-1" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#B23E1D" />
        <stop offset="100%" stop-color="#DE6424" />
      </linearGradient>
      <linearGradient id="ishti-icon-altar-left-2" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#C2471F" />
        <stop offset="100%" stop-color="#E96F26" />
      </linearGradient>
      <linearGradient id="ishti-icon-altar-left-3" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#CF5122" />
        <stop offset="100%" stop-color="#F27B2A" />
      </linearGradient>
      <linearGradient id="ishti-icon-altar-left-4" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#DC5D25" />
        <stop offset="100%" stop-color="#F98933" />
      </linearGradient>

      <!-- Altar Right Facets (Deep Temple Maroon shadow) -->
      <linearGradient id="ishti-icon-altar-right-1" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#7B1D16" />
        <stop offset="100%" stop-color="#54120D" />
      </linearGradient>
      <linearGradient id="ishti-icon-altar-right-2" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#882119" />
        <stop offset="100%" stop-color="#601510" />
      </linearGradient>
      <linearGradient id="ishti-icon-altar-right-3" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#96261D" />
        <stop offset="100%" stop-color="#6E1913" />
      </linearGradient>
      <linearGradient id="ishti-icon-altar-right-4" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#A52C21" />
        <stop offset="100%" stop-color="#7B1E16" />
      </linearGradient>

      <!-- Altar Top Tread Highlight (Glowing fire reflection) -->
      <linearGradient id="ishti-icon-altar-tread-left" x1="0%" y1="100%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#EF7428" />
        <stop offset="100%" stop-color="#F9AB43" />
      </linearGradient>
      <linearGradient id="ishti-icon-altar-tread-right" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#E59938" />
        <stop offset="100%" stop-color="#9C271C" />
      </linearGradient>
    </defs>
    
  <g class="ishti-symbol">
    <!-- ==================== STEPPED VEDIC ALTAR ==================== -->
    <!-- TIER 1 (BASE) -->
    <polygon points="200,358 68,303 68,318 200,373" fill="url(#ishti-icon-altar-left-1)"  />
    <polygon points="200,358 332,303 332,318 200,373" fill="url(#ishti-icon-altar-right-1)"  />
    <polygon points="200,358 68,303 94,292 200,344" fill="url(#ishti-icon-altar-tread-left)" />
    <polygon points="200,358 332,303 306,292 200,344" fill="url(#ishti-icon-altar-tread-right)" />

    <!-- TIER 2 -->
    <polygon points="200,344 94,292 94,306 200,358" fill="url(#ishti-icon-altar-left-2)"  />
    <polygon points="200,344 306,292 306,306 200,358" fill="url(#ishti-icon-altar-right-2)"  />
    <polygon points="200,344 94,292 120,281 200,330" fill="url(#ishti-icon-altar-tread-left)" />
    <polygon points="200,344 306,292 280,281 200,330" fill="url(#ishti-icon-altar-tread-right)" />

    <!-- TIER 3 -->
    <polygon points="200,330 120,281 120,294 200,344" fill="url(#ishti-icon-altar-left-3)"  />
    <polygon points="200,330 280,281 280,294 200,344" fill="url(#ishti-icon-altar-right-3)"  />
    <polygon points="200,330 120,281 146,270 200,316" fill="url(#ishti-icon-altar-tread-left)" />
    <polygon points="200,330 280,281 254,270 200,316" fill="url(#ishti-icon-altar-tread-right)" />

    <!-- TIER 4 (TOP PLATFORM & HEARTH) -->
    <polygon points="200,316 146,270 146,282 200,330" fill="url(#ishti-icon-altar-left-4)"  />
    <polygon points="200,316 254,270 254,282 200,330" fill="url(#ishti-icon-altar-right-4)"  />
    <!-- Hearth Top Bed -->
    <polygon points="200,316 146,270 200,248 254,270" fill="#EF7428" />
    <polygon points="200,312 152,270 200,252 248,270" fill="#99261B" />

    <!-- ==================== SACRED AGNI FLAME ==================== -->
    <!-- Left Wing -->
    <path d="M 182,266 C 160,268 135,254 124,226 C 114,198 122,168 144,142 C 148,137 154,142 152,148 C 142,172 144,194 158,212 C 168,224 178,232 186,242 Z" fill="url(#ishti-icon-flame-main)" />

    <!-- Right Wing -->
    <path d="M 218,266 C 240,268 265,254 276,226 C 286,198 278,168 256,142 C 252,137 246,142 248,148 C 258,172 256,194 242,212 C 232,224 222,232 214,242 Z" fill="url(#ishti-icon-flame-main)" />

    <!-- Intermediate Left Tongue -->
    <path d="M 174,236 C 158,222 152,192 160,162 C 164,146 172,130 178,114 C 180,109 184,112 183,117 C 178,138 182,156 192,172 C 196,178 198,186 196,194 Z" fill="url(#ishti-icon-flame-main)" />

    <!-- Intermediate Right Tongue -->
    <path d="M 226,236 C 242,222 248,192 240,162 C 236,146 228,130 222,114 C 220,109 216,112 217,117 C 222,138 218,156 208,172 C 204,178 202,186 204,194 Z" fill="url(#ishti-icon-flame-main)" />

    <!-- Central Flame Spire (The Heart of Agni) -->
    <path d="M 188,212 C 186,182 192,152 198,124 C 202,104 204,84 205,62 C 205.5,58 208.5,58 209,62 C 211,82 213,102 211,122 C 209,148 208,176 212,212 C 208,216 192,216 188,212 Z" fill="url(#ishti-icon-flame-spire)" />

    <!-- Negative space clearing for the Golden Seed Bindu -->
    <path d="M 200,214 C 188,226 188,242 200,254 C 212,242 212,226 200,214 Z" fill="#F8F4ED" />

    <!-- The Sacred Golden Bindu Drop (Ghee / Seed Flame) -->
    <path d="M 200,219 C 193,228 193,239 200,248 C 207,239 207,228 200,219 Z" fill="url(#ishti-icon-bindu)" />

    <!-- Floating Sparks & Embers -->
    <path d="M 207,40 C 204.5,43.5 204.5,47.5 207,51 C 209.5,47.5 209.5,43.5 207,40 Z" fill="url(#ishti-icon-flame-spire)" />
    <path d="M 175,82 C 173,85 173.5,88 176,90 C 178,88 177.5,85 175,82 Z" fill="url(#ishti-icon-flame-spire)" />
    <path d="M 227,88 C 225,91 225.5,94 228,96 C 230,94 229.5,91 227,88 Z" fill="url(#ishti-icon-flame-spire)" />
    <circle cx="152" cy="116" r="2.2" fill="url(#ishti-icon-flame-main)" />
    <circle cx="254" cy="126" r="2.2" fill="url(#ishti-icon-flame-main)" />
  </g>
  
</svg>