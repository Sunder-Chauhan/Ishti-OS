    <!-- Negative space clearing for the Golden Seed Bindu -->
    <path d="M 200,214 C 188,226 188,242 200,254 C 212,242 212,226 200,214 Z" fill="#F8F4ED" />

    <!-- The Sacred Golden Bindu Drop (Ghee / Seed Flame) -->
    <path d="M 200,219 C 193,228 193,239 200,248 C 207,239 207,228 200,219 Z" fill="url(#ishti-pri-bindu)" />

    <!-- Floating Sparks & Embers -->
    <path d="M 207,40 C 204.5,43.5 204.5,47.5 207,51 C 209.5,47.5 209.5,43.5 207,40 Z" fill="url(#ishti-pri-flame-spire)" />
    <path d="M 175,82 C 173,85 173.5,88 176,90 C 178,88 177.5,85 175,82 Z" fill="url(#ishti-pri-flame-spire)" />
    <path d="M 227,88 C 225,91 225.5,94 228,96 C 230,94 229.5,91 227,88 Z" fill="url(#ishti-pri-flame-spire)" />
    <circle cx="152" cy="116" r="2.2" fill="url(#ishti-pri-flame-main)" />
    <circle cx="254" cy="126" r="2.2" fill="url(#ishti-pri-flame-main)" />
  </g>
  
  <g fill="#711B16">
    
