<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 560" width="100%" height="100%" fill="none" role="img" aria-label="ISHTI Primary Logo - Full Symbol, Wordmark and Supporting Taglines">
  <title>ISHTI Primary Logo</title>
  <desc>ISHTI sacred fire altar symbol, custom serif wordmark, and taglines: Transformative Rituals &amp; Offerings, Vedic Essence &amp; Rituals</desc>
  
  
    <defs>
      <!-- Flame gradient: Deep maroon at base to vibrant saffron to radiant gold at tip -->
      <linearGradient id="ishti-pri-flame-main" x1="50%" y1="100%" x2="50%" y2="0%">
        <stop offset="0%" stop-color="#711B16" />
        <stop offset="35%" stop-color="#C23616" />
        <stop offset="70%" stop-color="#EF7428" />
        <stop offset="100%" stop-color="#F7B731" />
      </linearGradient>

      <!-- Outer flame gradient -->
      <linearGradient id="ishti-pri-flame-outer" x1="0%" y1="100%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#711B16" />
        <stop offset="50%" stop-color="#D3461A" />
        <stop offset="100%" stop-color="#EF7428" />
      </linearGradient>

      <!-- Center inner spire gradient -->
      <linearGradient id="ishti-pri-flame-spire" x1="50%" y1="100%" x2="50%" y2="0%">
        <stop offset="0%" stop-color="#D3461A" />
        <stop offset="50%" stop-color="#EF7428" />
        <stop offset="100%" stop-color="#FDCB58" />
      </linearGradient>

      <!-- Golden Seed Bindu drop gradient -->
      <radialGradient id="ishti-pri-bindu" cx="50%" cy="40%" r="60%">
        <stop offset="0%" stop-color="#FFF2A3" />
        <stop offset="60%" stop-color="#D7A64A" />
        <stop offset="100%" stop-color="#EF7428" />
      </radialGradient>

      <!-- Altar Left Facets (Saffron & Terracotta light) -->
      <linearGradient id="ishti-pri-altar-left-1" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#B23E1D" />
        <stop offset="100%" stop-color="#DE6424" />
      </linearGradient>
      <linearGradient id="ishti-pri-altar-left-2" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#C2471F" />
        <stop offset="100%" stop-color="#E96F26" />
      </linearGradient>
      <linearGradient id="ishti-pri-altar-left-3" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#CF5122" />
        <stop offset="100%" stop-color="#F27B2A" />
      </linearGradient>
      <linearGradient id="ishti-pri-altar-left-4" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#DC5D25" />
        <stop offset="100%" stop-color="#F98933" />
      </linearGradient>

      <!-- Altar Right Facets (Deep Temple Maroon shadow) -->
      <linearGradient id="ishti-pri-altar-right-1" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#7B1D16" />
        <stop offset="100%" stop-color="#54120D" />
      </linearGradient>
      <linearGradient id="ishti-pri-altar-right-2" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#882119" />
        <stop offset="100%" stop-color="#601510" />
      </linearGradient>
      <linearGradient id="ishti-pri-altar-right-3" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#96261D" />
        <stop offset="100%" stop-color="#6E1913" />
      </linearGradient>
      <linearGradient id="ishti-pri-altar-right-4" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#A52C21" />
        <stop offset="100%" stop-color="#7B1E16" />
      </linearGradient>

      <!-- Altar Top Tread Highlight (Glowing fire reflection) -->
      <linearGradient id="ishti-pri-altar-tread-left" x1="0%" y1="100%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#EF7428" />
        <stop offset="100%" stop-color="#F9AB43" />
      </linearGradient>
      <linearGradient id="ishti-pri-altar-tread-right" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#E59938" />
        <stop offset="100%" stop-color="#9C271C" />
      </linearGradient>
    </defs>
    
