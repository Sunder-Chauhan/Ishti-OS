    <polygon points="200,316 146,270 200,248 254,270" fill="#EF7428" />
    <polygon points="200,312 152,270 200,252 248,270" fill="#99261B" />

    <!-- ==================== SACRED AGNI FLAME ==================== -->
    <!-- Left Wing -->
    <path d="M 182,266 C 160,268 135,254 124,226 C 114,198 122,168 144,142 C 148,137 154,142 152,148 C 142,172 144,194 158,212 C 168,224 178,232 186,242 Z" fill="url(#ishti-pri-flame-main)" />

